name: Build Android APK

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build debug/release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build web assets (PWA)
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Add Capacitor Android platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ---------- Firma automática (opcional) ----------
      - name: Decode keystore (si existen secrets)
        if: ${{ secrets.SIGNING_KEY != '' }}
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > android/app/release-key.jks
          echo "Keystore decodificado"

      - name: Configure signing in build.gradle
        if: ${{ secrets.SIGNING_KEY != '' }}
        run: |
          # Añadir signingConfigs al final de android { } en app/build.gradle
          cat >> android/app/build.gradle << 'GRADLE'

          android.signingConfigs {
              release {
                  storeFile file('release-key.jks')
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEY_PASSWORD")
              }
          }
          android.buildTypes.release.signingConfig android.signingConfigs.release
          GRADLE

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (firmado si hay secrets)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        continue-on-error: true

      - name: List generated APKs
        run: find android/app/build/outputs -name "*.apk" -type f || true

      - name: Upload Debug APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cuba-pos-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Release APK as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuba-pos-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "### Resultado del build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo "- **Firma**: activada (secrets detectados)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Firma**: no configurada (APK unsigned)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          find android/app/build/outputs -name "*.apk" -type f 2>/dev/null | while read f; do
            echo "- $f ($(du -h "$f" | cut -f1))" >> $GITHUB_STEP_SUMMARY
          done || echo "No se generó ningún APK" >> $GITHUB_STEP_SUMMARY
