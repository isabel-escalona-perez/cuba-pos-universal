name: Build Android APK

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build debug/release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build web assets (PWA)
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # === Android SDK setup (moderno, sin el paquete 'tools' deprecado) ===
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''   # no instalamos nada aquí para evitar el error de 'tools'

      - name: Install Android SDK components (solo los necesarios)
        run: |
          # Usamos cmdline-tools actuales (ya instalados por la action)
          yes | sdkmanager --licenses > /dev/null || true

          # Solo paquetes modernos (sin 'tools')
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          # Verificación
          echo "SDK instalado en: $ANDROID_HOME"
          sdkmanager --list_installed | head -20

      - name: Add Capacitor Android platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (unsigned)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        continue-on-error: true

      - name: List generated APKs
        run: find android/app/build/outputs -name "*.apk" -type f || true

      - name: Upload Debug APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cuba-pos-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Release APK as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuba-pos-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "### Resultado del build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          find android/app/build/outputs -name "*.apk" -type f 2>/dev/null | while read f; do
            echo "- $f ($(du -h "$f" | cut -f1))" >> $GITHUB_STEP_SUMMARY
          done || echo "No se generó ningún APK" >> $GITHUB_STEP_SUMMARY
